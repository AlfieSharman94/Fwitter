<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Fwitter Side Menu</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d59f2",
                        "background-light": "#f5f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Lexend"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Lexend', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<!-- Main Container representing the phone screen -->
<div class="relative flex h-screen w-full max-w-[430px] mx-auto overflow-hidden bg-[#000000] border-x border-gray-800">
<!-- Mock Content Layer (The feed behind the drawer) -->
<div class="absolute inset-0 flex flex-col opacity-40">
<header class="flex items-center justify-between px-4 py-3 border-b border-gray-800">
<div class="size-8 rounded-full bg-gray-700"></div>
<div class="text-primary font-bold text-xl">Fwitter</div>
<span class="material-symbols-outlined text-white">settings</span>
</header>
<div class="p-4 space-y-4">
<div class="h-32 bg-gray-900 rounded-xl w-full"></div>
<div class="h-32 bg-gray-900 rounded-xl w-full"></div>
<div class="h-32 bg-gray-900 rounded-xl w-full"></div>
</div>
</div>
<!-- Backdrop Overlay -->
<div class="absolute inset-0 z-40 bg-black/60 backdrop-blur-sm"></div>
<!-- Navigation Drawer Layer -->
<div class="absolute left-0 top-0 z-50 h-full w-[85%] bg-background-light dark:bg-background-dark shadow-2xl flex flex-col border-r border-white/10">
<!-- User Profile Header -->
<div class="px-6 pt-8 pb-4">
<div class="size-16 rounded-full overflow-hidden mb-4 border-2 border-primary">
<img alt="User profile photo" class="size-full object-cover" data-alt="Professional headshot of a smiling man" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA1deS-zDXjMyUUStwzjWzKKsxJ-a_oSgOV9xGeHXq11pdIo5f2UydiLU1A7-DqWfjvDGWtXfgbMbfOKfj1lcPAZjtpy8_2eD7Osbsel3XXhsoPhcR_bsEN2GxN1cp3a6Lv6QCltpW8EYO_1XtlwauROJhOFauwBkDemru0DdUVZdHa1ilfGXPz3wvYdUD5arhk0dcfXzDvRvq_LxBvszjlxTxaQHfzN6mlmP6oWL8HR4Lebax_imXEdWYu7FDkNd3q2XYFLoFPGYE"/>
</div>
<div class="flex flex-col">
<div class="flex items-center gap-1">
<p class="text-black dark:text-white text-xl font-bold leading-tight">John Doe</p>
<span class="material-symbols-outlined text-primary text-sm fill-icon">verified</span>
</div>
<p class="text-gray-500 dark:text-gray-400 text-sm">@jdoe_fc</p>
</div>
</div>
<!-- Profile Stats Section -->
<div class="flex gap-6 px-6 py-4 border-b border-gray-100 dark:border-gray-800/50">
<div class="flex items-center gap-1">
<p class="text-black dark:text-white text-base font-bold">420</p>
<p class="text-gray-500 dark:text-gray-400 text-sm">Following</p>
</div>
<div class="flex items-center gap-1">
<p class="text-black dark:text-white text-base font-bold">12.5K</p>
<p class="text-gray-500 dark:text-gray-400 text-sm">Followers</p>
</div>
</div>
<!-- Navigation Links -->
<nav class="flex-1 px-2 py-4 space-y-1">
<!-- Profile -->
<div class="flex items-center gap-4 px-4 min-h-14 justify-between rounded-lg hover:bg-primary/10 transition-colors group">
<div class="flex items-center gap-4">
<div class="text-black dark:text-white flex items-center justify-center rounded-lg bg-gray-100 dark:bg-gray-800/50 group-hover:bg-primary/20 shrink-0 size-10">
<span class="material-symbols-outlined">person</span>
</div>
<p class="text-black dark:text-white text-base font-medium flex-1 truncate">Profile</p>
</div>
<div class="shrink-0">
<span class="material-symbols-outlined text-gray-400 text-lg">chevron_right</span>
</div>
</div>
<!-- Communities (Custom added for sports context) -->
<div class="flex items-center gap-4 px-4 min-h-14 justify-between rounded-lg hover:bg-primary/10 transition-colors group">
<div class="flex items-center gap-4">
<div class="text-black dark:text-white flex items-center justify-center rounded-lg bg-gray-100 dark:bg-gray-800/50 group-hover:bg-primary/20 shrink-0 size-10">
<span class="material-symbols-outlined">sports_soccer</span>
</div>
<p class="text-black dark:text-white text-base font-medium flex-1 truncate">Club Lounge</p>
</div>
<div class="shrink-0">
<span class="material-symbols-outlined text-gray-400 text-lg">chevron_right</span>
</div>
</div>
<!-- Settings -->
<div class="flex items-center gap-4 px-4 min-h-14 justify-between rounded-lg hover:bg-primary/10 transition-colors group">
<div class="flex items-center gap-4">
<div class="text-black dark:text-white flex items-center justify-center rounded-lg bg-gray-100 dark:bg-gray-800/50 group-hover:bg-primary/20 shrink-0 size-10">
<span class="material-symbols-outlined">settings</span>
</div>
<p class="text-black dark:text-white text-base font-medium flex-1 truncate">Settings</p>
</div>
<div class="shrink-0">
<span class="material-symbols-outlined text-gray-400 text-lg">chevron_right</span>
</div>
</div>
<!-- Help -->
<div class="flex items-center gap-4 px-4 min-h-14 justify-between rounded-lg hover:bg-primary/10 transition-colors group">
<div class="flex items-center gap-4">
<div class="text-black dark:text-white flex items-center justify-center rounded-lg bg-gray-100 dark:bg-gray-800/50 group-hover:bg-primary/20 shrink-0 size-10">
<span class="material-symbols-outlined">help</span>
</div>
<p class="text-black dark:text-white text-base font-medium flex-1 truncate">Help Center</p>
</div>
<div class="shrink-0">
<span class="material-symbols-outlined text-gray-400 text-lg">chevron_right</span>
</div>
</div>
</nav>
<!-- Bottom Section -->
<div class="p-6 border-t border-gray-100 dark:border-gray-800/50">
<button class="flex items-center gap-3 text-red-500 font-medium">
<span class="material-symbols-outlined">logout</span>
<span>Log out</span>
</button>
<div class="mt-6 flex items-center justify-between opacity-30">
<span class="text-xs text-black dark:text-white uppercase tracking-widest font-bold">Fwitter</span>
<span class="text-[10px] text-black dark:text-white">v2.4.0 (iOS)</span>
</div>
</div>
</div>
</div>
</body></html>
