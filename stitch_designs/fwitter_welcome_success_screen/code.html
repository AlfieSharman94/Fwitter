<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;family=Noto+Sans:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">

            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d59f2",
                        "background-light": "#f5f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Lexend', sans-serif;
        }
        .confetti-gradient {
            background-image: radial-gradient(circle, rgba(13, 89, 242, 0.15) 1px, transparent 1px),

            background-size: 20px 20px, 30px 30px;
            background-position: 0 0, 15px 15px;
        }
    </style>
<style>

</div>

<div class="relative z-10 -mt-8">
<h1 class="text-white tracking-tight text-[36px] font-bold leading-tight px-6 text-center pb-2">
                Welcome to the Pitch!
            </h1>
</div>
<!-- Success Body Text -->
<div class="px-6">
<p class="text-[#90a4cb] text-base font-normal leading-relaxed text-center pb-6">
                You're all set to join the global football conversation. From transfer news to matchday rants, it all happens here.
            </p>
</div>
<!-- Profile/Team Card -->
<div class="px-6 pb-6">
<div class="flex items-center justify-between gap-4 rounded-xl bg-[#182234] p-5 shadow-lg border border-white/5">
<div class="flex flex-col gap-1">

<p class="text-white text-lg font-bold leading-tight">@football_fanatic</p>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1">sports_soccer</span>

</div>
</div>

</div>
</div>

<div class="h-12 w-12 rounded-full bg-primary/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-3xl">celebration</span>
</div>
</div>
<!-- Spacer to push button to bottom -->
<div class="flex-grow"></div>
<!-- Primary Action Button -->
<div class="flex px-6 py-8">
<button class="flex min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary text-white text-lg font-bold leading-normal tracking-wide shadow-[0_8px_20px_rgba(13,89,242,0.3)] hover:scale-[1.02] transition-transform active:scale-[0.98]">
<span class="truncate">Enter Fwitter</span>
</button>
</div>

<div class="h-6 bg-background-light dark:bg-background-dark"></div>
</div>
