<title>Fwitter Log In Screen</title>

<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d59f2",
                        "background-light": "#f5f6f8",
                        "background-dark": "#101622",

                    borderRadius: {
                        "DEFAULT": "0.25rem",

    </script>
<style type="text/tailwindcss">
        body {
            font-family: "Lexend", sans-serif;
            min-height: 100dvh;
        }
        .stadium-overlay {
            background-image: linear-gradient(to bottom, rgba(16, 22, 34, 0.9), rgba(16, 22, 34, 1)), url(https://lh3.googleusercontent.com/aida-public/AB6AXuB9OUqGETqHH4Qk-e1SXHKYzEYzUvaoC49hXJ_UJeZEIFaQLxQnewRA-EjbrPWSlhR6xoot9gUTpH3rhKAI9KWD75QXThXiz3AzllKTC9VLS_ac5l-GRrPcljvXHyYzJQjU4Wd6Nlupuld89Puksf5LZ5SvbsCpKgOw2ai2TSHRpHqO2Ut4YYQCNIHSkN-qxA6hnXaYzZeH6gBEZ_8-aAHjiXRsMqmHOFMg-sZS-7LNZZkhDilndap3RV9lvKIEr6Q9haV7HEdKnik);

            background-position: center;
        }
        input::placeholder {
            color: #5b7083;
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background-dark text-white font-display overflow-x-hidden">
<div class="relative flex min-h-screen w-full flex-col stadium-overlay">
<div class="flex items-center justify-between px-4 py-4">
<button class="text-white">
<span class="material-symbols-outlined">close</span>
</button>
<div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-white text-2xl" style="font-variation-settings: 'FILL' 1, 'wght' 700;">sports_soccer</span>
</div>
<div class="w-6"></div> 
</div>
<div class="flex flex-col px-8 pt-8 w-full max-w-[480px] mx-auto">
<h1 class="text-white tracking-tight text-3xl font-bold mb-8">
                Log in to Fwitter
            </h1>
<div class="flex flex-col gap-6">
<div class="relative">
<input class="w-full bg-transparent border-b border-[#222f49] focus:border-primary focus:ring-0 px-0 py-3 text-lg transition-colors placeholder-transparent peer" id="identifier" placeholder="Phone, email, or username" type="text"/>
<label class="absolute left-0 -top-3.5 text-[#90a4cb] text-sm transition-all peer-placeholder-shown:text-lg peer-placeholder-shown:top-3 peer-focus:-top-3.5 peer-focus:text-primary peer-focus:text-sm" for="identifier">
                        Phone, email, or username
                    </label>
</div>
<div class="relative">
<input class="w-full bg-transparent border-b border-[#222f49] focus:border-primary focus:ring-0 px-0 py-3 text-lg transition-colors placeholder-transparent peer" id="password" placeholder="Password" type="password"/>
<label class="absolute left-0 -top-3.5 text-[#90a4cb] text-sm transition-all peer-placeholder-shown:text-lg peer-placeholder-shown:top-3 peer-focus:-top-3.5 peer-focus:text-primary peer-focus:text-sm" for="password">
                        Password
                    </label>
</div>
</div>
<div class="mt-4">
<a class="text-primary text-sm font-medium hover:underline" href="#">Forgot password?</a>
</div>
</div>
<div class="mt-auto flex flex-col items-center pb-12 w-full max-w-[480px] mx-auto px-8">
<button class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-14 px-5 bg-primary text-white text-lg font-bold leading-normal tracking-tight w-full shadow-lg shadow-primary/30 transition-transform active:scale-95 mb-6">
<span class="truncate">Log in</span>
</button>
<div class="text-center">
<p class="text-[#90a4cb] text-sm">
                    Don't have an account? 
                    <a class="text-primary font-bold hover:underline" href="#">Sign up</a>
</p>
</div>
</div>
</div>
<div class="fixed inset-0 pointer-events-none z-[-1] opacity-10">
<div class="w-full h-full bg-center bg-no-repeat bg-cover" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBH2oFow2dcXKj0Ar0JycIChDB6DVDMywpbvKL5rmFqk3rqSm-vHFy6IP7aQ5xG0_Cs7gR-D-wWbJjsMgp5oRSnPbgeuLtktgrEcbZqqGw_-S4gDnIhdHa441iwJz0qUZH5kB-_3rdy2TpKlFjOZJHhbzgREMc5Pfr4GhaCQd5-O_Jf-s7ycGr6cnhfl0XFHa_0ej42RimYzJY7_1-zn-Np76KjfIfnm-P2UZ2zGK6ftp7osFtlexAtZ981BFaslrCIRkYtv5DnWwE");'></div>
</div>
