<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Fwitter Username Setup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d59f2",
                        "background-light": "#f5f6f8",
                        "background-dark": "#101622",
                        "surface-dark": "#1c2636",
                        "border-dark": "#314368"
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            font-family: 'Lexend', sans-serif;
            -webkit-tap-highlight-color: transparent;
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white min-h-screen flex flex-col">
<header class="sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
<div class="flex items-center p-4 pb-2 justify-between">
<div class="text-slate-900 dark:text-white flex size-10 shrink-0 items-center justify-center cursor-pointer">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</div>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Step 1 of 4</h2>
<div class="size-10"></div>
</div>
<div class="px-4 pb-4">
<div class="w-full bg-slate-200 dark:bg-border-dark h-1.5 rounded-full overflow-hidden">
<div class="bg-primary h-full transition-all duration-500" style="width: 25%;"></div>
</div>
</div>
</header>
<main class="flex-1 px-4 pt-6">
<div class="mb-10">
<h1 class="text-slate-900 dark:text-white tracking-tight text-3xl font-bold leading-tight mb-2">What should we call you?</h1>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-relaxed">
                Pick a unique username for your Fwitter profile. You can change this later.
            </p>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
<span class="text-primary text-xl font-bold">@</span>
</div>
<input autocomplete="off" class="block w-full pl-12 pr-4 py-5 bg-white dark:bg-surface-dark border-none rounded-2xl text-slate-900 dark:text-white text-xl font-semibold placeholder-slate-400 focus:ring-2 focus:ring-primary transition-all shadow-sm" placeholder="username" spellcheck="false" type="text"/>
<div class="mt-3 flex items-center gap-2 px-1">
<span class="material-symbols-outlined text-emerald-500 text-sm" style="font-variation-settings: 'FILL' 1">check_circle</span>
<p class="text-slate-500 dark:text-slate-400 text-sm">Username is available</p>
</div>
</div>
<div class="mt-12 p-5 bg-primary/5 border border-primary/10 rounded-2xl">
<div class="flex gap-3">
<span class="material-symbols-outlined text-primary">info</span>
<div>
<h4 class="font-bold text-slate-900 dark:text-white text-sm mb-1">Fan Identity</h4>
<p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
                        Many fans use their club name or a terrace chant in their username. Get creative!
                    </p>
</div>
</div>
</div>
</main>
<footer class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-background-light dark:from-background-dark via-background-light/95 dark:via-background-dark/95 to-transparent pb-10">
<button class="w-full py-4 bg-primary text-white font-bold text-lg rounded-xl shadow-lg shadow-primary/25 active:scale-[0.98] transition-all">
            Continue
        </button>
<div class="h-4"></div>
</footer>

</body></html>
