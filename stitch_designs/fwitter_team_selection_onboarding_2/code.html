<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Fwitter Registration - Step 2</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d59f2",
                        "background-light": "#f5f6f8",
                        "background-dark": "#101622",
                        "surface-dark": "#1c2636",
                        "border-dark": "#314368"
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            font-family: 'Lexend', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white min-h-screen flex flex-col">
<header class="sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
<div class="flex items-center p-4 pb-2 justify-between">
<div class="text-slate-900 dark:text-white flex size-10 shrink-0 items-center justify-center cursor-pointer">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</div>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Step 2 of 4</h2>
<div class="size-10"></div>
</div>
<div class="px-4 pb-4">
<div class="w-full bg-slate-200 dark:bg-border-dark h-1.5 rounded-full overflow-hidden">
<div class="bg-primary h-full transition-all duration-500" style="width: 50%;"></div>
</div>
</div>
</header>
<main class="flex-1 px-4 pt-6 pb-32">
<div class="mb-8">
<h1 class="text-slate-900 dark:text-white tracking-tight text-3xl font-bold leading-tight mb-2">Personal Details</h1>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-relaxed">
                Tell us a bit more about yourself to complete your profile.
            </p>
</div>
<div class="space-y-5">
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5 ml-1">Display Name</label>
<input autocomplete="name" class="block w-full px-4 py-4 bg-white dark:bg-surface-dark border border-slate-200 dark:border-border-dark rounded-xl text-slate-900 dark:text-white text-base placeholder-slate-400 focus:ring-2 focus:ring-primary focus:border-transparent transition-all" placeholder="e.g. Harry Kane" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5 ml-1">Email Address</label>
<input autocomplete="email" class="block w-full px-4 py-4 bg-white dark:bg-surface-dark border border-slate-200 dark:border-border-dark rounded-xl text-slate-900 dark:text-white text-base placeholder-slate-400 focus:ring-2 focus:ring-primary focus:border-transparent transition-all" placeholder="email@example.com" type="email"/>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-5">
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5 ml-1">Password</label>
<input autocomplete="new-password" class="block w-full px-4 py-4 bg-white dark:bg-surface-dark border border-slate-200 dark:border-border-dark rounded-xl text-slate-900 dark:text-white text-base placeholder-slate-400 focus:ring-2 focus:ring-primary focus:border-transparent transition-all" placeholder="••••••••" type="password"/>
</div>
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5 ml-1">Confirm Password</label>
<input autocomplete="new-password" class="block w-full px-4 py-4 bg-white dark:bg-surface-dark border border-slate-200 dark:border-border-dark rounded-xl text-slate-900 dark:text-white text-base placeholder-slate-400 focus:ring-2 focus:ring-primary focus:border-transparent transition-all" placeholder="••••••••" type="password"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5 ml-1">Date of Birth</label>
<div class="relative">
<input class="block w-full px-4 py-4 bg-white dark:bg-surface-dark border border-slate-200 dark:border-border-dark rounded-xl text-slate-900 dark:text-white text-base placeholder-slate-400 focus:ring-2 focus:ring-primary focus:border-transparent transition-all appearance-none" type="date"/>
<div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-slate-400">
<span class="material-symbols-outlined">calendar_today</span>
</div>
</div>
<p class="mt-2 text-[10px] text-slate-500 dark:text-slate-400 ml-1">You must be at least 13 years old to use Fwitter.</p>
</div>
</div>
</main>
<footer class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-background-light dark:from-background-dark via-background-light/95 dark:via-background-dark/95 to-transparent">
<button class="w-full py-4 bg-primary text-white font-bold text-lg rounded-xl shadow-lg shadow-primary/25 active:scale-[0.98] transition-all">
            Continue
        </button>
<div class="h-4"></div>
</footer>

</body></html>
